<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <title>Endless</title>
  </head>
  <body>
    <div id="blocker">
      <div id="loader">
        <p id="loader-title">Loading</p>
        <div id="loader-bar"><div id="loader-bar-fill"></div></div>
        <p id="loader-percent">0%</p>
      </div>
      <div id="instructions" style="display: none">
        <p id="instructions-title">Click to play</p>
        <div id="instructions-subtitle">
          <p>Move: WASD</p>
          <p>Exit: Esc</p>
        </div>
      </div>
    </div>
    <div id="experience">
      <canvas class="experience-canvas"></canvas>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
